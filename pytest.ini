[pytest]
testpaths = tests
pythonpath = .
addopts = -q --strict-markers
filterwarnings =
    default
    # Both are real and tracked in docs/architecture/ERRATA.md section B.
    # Listed here so the suite output stays readable, NOT to hide them --
    # delete these two lines once the deprecations are fixed.
    ignore:.*on_event is deprecated.*:DeprecationWarning
    ignore:.*datetime.datetime.utcnow\(\) is deprecated.*:DeprecationWarning
