<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bob Reliability Engineer</title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --panel-2: #f0f2f5; --line: #dfe3e8; --text: #1b2430; --muted: #5d6b7c;
    --accent: #0f62fe; --accent-2: #edf3ff; --ok: #14804a; --ok-bg: #e4f6ec; --warn: #a15c00; --warn-bg: #fff3dd;
    --bad: #b4232c; --bad-bg: #fde8ea; --info: #6a3fd1; --info-bg: #efe9fb; --code: #f3f5f8;
    --add: #e6f6ea; --del: #fdeaec; --shadow: 0 1px 2px rgba(16,24,40,.06);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0e1116; --panel: #161b22; --panel-2: #1c232c; --line: #2b3440; --text: #e6ebf1; --muted: #93a1b3;
      --accent: #6ea0ff; --accent-2: #172033; --ok: #4cc38a; --ok-bg: #12291e; --warn: #f0b04a; --warn-bg: #2d2412;
      --bad: #ff8a92; --bad-bg: #331a1d; --info: #b394ff; --info-bg: #241b3d; --code: #10151b; --add: #10291a; --del: #33191c;
      --shadow: none;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0e1116; --panel: #161b22; --panel-2: #1c232c; --line: #2b3440; --text: #e6ebf1; --muted: #93a1b3;
    --accent: #6ea0ff; --accent-2: #172033; --ok: #4cc38a; --ok-bg: #12291e; --warn: #f0b04a; --warn-bg: #2d2412;
    --bad: #ff8a92; --bad-bg: #331a1d; --info: #b394ff; --info-bg: #241b3d; --code: #10151b; --add: #10291a; --del: #33191c; --shadow: none;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  code, pre, .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12.5px; }
  button { font: inherit; cursor: pointer; }
  a { color: var(--accent); }

  header.top { display: flex; align-items: center; gap: 16px; padding: 10px 20px; background: var(--panel); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 5; flex-wrap: wrap; }
  .brand { font-weight: 700; letter-spacing: -.01em; font-size: 16px; display: flex; align-items: center; gap: 8px; }
  .brand .logo { width: 22px; height: 22px; border-radius: 6px; background: linear-gradient(135deg, var(--accent), #8a3ffc); display: inline-block; }
  .brand small { color: var(--muted); font-weight: 500; }
  nav.tabs { display: flex; gap: 4px; margin-left: 8px; }
  nav.tabs button { background: transparent; border: 0; padding: 6px 12px; border-radius: 8px; color: var(--muted); font-weight: 600; }
  nav.tabs button[aria-selected="true"] { background: var(--accent-2); color: var(--accent); }
  .spacer { flex: 1; }
  .mode { padding: 4px 10px; border-radius: 999px; font-size: 12px; font-weight: 700; letter-spacing: .02em; border: 1px solid transparent; }
  .mode.sim { background: var(--warn-bg); color: var(--warn); border-color: color-mix(in srgb, var(--warn) 30%, transparent); }
  .mode.live { background: var(--ok-bg); color: var(--ok); border-color: color-mix(in srgb, var(--ok) 30%, transparent); }
  .mode.none { background: var(--bad-bg); color: var(--bad); }
  .iconbtn { background: var(--panel-2); border: 1px solid var(--line); color: var(--text); border-radius: 8px; padding: 5px 9px; }

  main { display: grid; grid-template-columns: 320px 1fr; gap: 16px; padding: 16px 20px; max-width: 1500px; margin: 0 auto; }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; padding: 12px 16px; } }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); }
  .card h2, .card h3 { margin: 0; }
  .pad { padding: 14px 16px; }
  .sub { color: var(--muted); font-size: 12.5px; }

  /* sidebar */
  .side .head { display: flex; align-items: center; justify-content: space-between; padding: 12px 14px; border-bottom: 1px solid var(--line); }
  .side .head h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
  .newbox { padding: 12px 14px; border-bottom: 1px solid var(--line); display: grid; gap: 8px; }
  .newbox select, .field { width: 100%; padding: 7px 9px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel-2); color: var(--text); font: inherit; }
  .btn { border: 1px solid var(--line); background: var(--panel-2); color: var(--text); border-radius: 8px; padding: 7px 12px; font-weight: 600; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.ok { background: var(--ok); border-color: var(--ok); color: #fff; }
  .btn.danger { background: transparent; border-color: var(--bad); color: var(--bad); }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  .list { max-height: 60vh; overflow: auto; }
  .row { display: block; width: 100%; text-align: left; background: transparent; border: 0; border-bottom: 1px solid var(--line); padding: 10px 14px; color: inherit; }
  .row:hover { background: var(--panel-2); }
  .row[aria-current="true"] { background: var(--accent-2); box-shadow: inset 3px 0 0 var(--accent); }
  .row .t { font-weight: 600; display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .m { display: flex; gap: 6px; align-items: center; margin-top: 4px; }

  .pill { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 11.5px; font-weight: 700; background: var(--panel-2); color: var(--muted); white-space: nowrap; }
  .pill.ok { background: var(--ok-bg); color: var(--ok); } .pill.bad { background: var(--bad-bg); color: var(--bad); }
  .pill.warn { background: var(--warn-bg); color: var(--warn); } .pill.info { background: var(--info-bg); color: var(--info); }
  .pill.acc { background: var(--accent-2); color: var(--accent); }

  /* incident */
  .title { padding: 16px; border-bottom: 1px solid var(--line); }
  .title h2 { font-size: 17px; letter-spacing: -.01em; }
  .stepper { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 12px; }
  .step { padding: 3px 9px; border-radius: 6px; background: var(--panel-2); color: var(--muted); font-size: 11.5px; font-weight: 700; }
  .step.done { background: var(--ok-bg); color: var(--ok); } .step.now { background: var(--accent); color: #fff; }
  .step.bad { background: var(--bad); color: #fff; }
  .actions { padding: 12px 16px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; border-bottom: 1px solid var(--line); background: var(--panel-2); border-radius: 0; }
  .approve { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; padding: 10px 12px; border: 1px dashed var(--warn); border-radius: 10px; background: var(--warn-bg); }
  .approve .field { width: 220px; }
  .notice { padding: 10px 16px; font-size: 13px; }
  .notice.warn { background: var(--warn-bg); color: var(--warn); } .notice.bad { background: var(--bad-bg); color: var(--bad); } .notice.ok { background: var(--ok-bg); color: var(--ok); }
  .tabs2 { display: flex; gap: 2px; padding: 8px 12px 0; border-bottom: 1px solid var(--line); overflow: auto; }
  .tabs2 button { background: transparent; border: 0; padding: 8px 12px; border-bottom: 2px solid transparent; color: var(--muted); font-weight: 600; white-space: nowrap; }
  .tabs2 button[aria-selected="true"] { color: var(--accent); border-bottom-color: var(--accent); }
  .panel { padding: 16px; }
  .grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 14px; }
  .kv { display: grid; grid-template-columns: 150px 1fr; gap: 6px 12px; }
  .kv dt { color: var(--muted); } .kv dd { margin: 0; overflow-wrap: anywhere; }

  .tl { list-style: none; margin: 0; padding: 0 0 0 14px; border-left: 2px solid var(--line); }
  .tl li { position: relative; padding: 0 0 14px 14px; }
  .tl li::before { content: ""; position: absolute; left: -22px; top: 5px; width: 10px; height: 10px; border-radius: 50%; background: var(--line); border: 2px solid var(--panel); }
  .tl li.ok::before { background: var(--ok); } .tl li.bad::before { background: var(--bad); } .tl li.acc::before { background: var(--accent); } .tl li.warn::before { background: var(--warn); }
  .tl .who { color: var(--muted); font-size: 12px; }
  table { border-collapse: collapse; width: 100%; }
  th, td { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { font-size: 11.5px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
  .bar { height: 8px; border-radius: 4px; background: var(--panel-2); overflow: hidden; min-width: 90px; }
  .bar > span { display: block; height: 100%; background: var(--accent); }
  pre.code { background: var(--code); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; overflow: auto; margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; }
  .diff { background: var(--code); border: 1px solid var(--line); border-radius: 8px; overflow: auto; }
  .diff div { padding: 0 10px; white-space: pre; } .diff .a { background: var(--add); } .diff .d { background: var(--del); } .diff .h { color: var(--muted); }
  details { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; background: var(--panel); }
  details + details { margin-top: 8px; } summary { cursor: pointer; font-weight: 600; }
  .empty { padding: 40px 16px; text-align: center; color: var(--muted); }
  .spin { display: inline-block; width: 14px; height: 14px; border: 2px solid var(--line); border-top-color: var(--accent); border-radius: 50%; animation: sp .8s linear infinite; vertical-align: -2px; }
  @keyframes sp { to { transform: rotate(360deg); } }
  .lvl { display: grid; grid-template-columns: 110px 1fr; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); }
  .banner { padding: 10px 14px; border-radius: 10px; margin-bottom: 14px; }
  .banner.sim { background: var(--warn-bg); color: var(--warn); }
  .finding { padding: 6px 0; } .stat { font-size: 22px; font-weight: 700; letter-spacing: -.02em; }
  .visually-hidden { position: absolute; left: -9999px; }
</style>
</head>
<body>
<header class="top">
  <div class="brand"><span class="logo"></span>Bob Reliability Engineer <small>verification-gated reliability loop</small></div>
  <nav class="tabs" role="tablist" aria-label="Sections">
    <button role="tab" data-view="incidents" aria-selected="true">Incidents</button>
    <button role="tab" data-view="learning" aria-selected="false">What BRE has learned</button>
    <button role="tab" data-view="evaluation" aria-selected="false">Evaluation</button>
  </nav>
  <span class="spacer"></span>
  <span id="mode" class="mode none" title="How Bob is being reached">…</span>
  <button class="iconbtn" id="theme" title="Toggle light / dark" aria-label="Toggle theme">◐</button>
</header>

<main>
  <aside class="card side" id="side">
    <div class="head"><h2>Incidents</h2><button class="btn" id="refresh" title="Reload">↻</button></div>
    <div class="newbox" id="newbox" hidden>
      <select id="scenario" aria-label="Demo scenario"></select>
      <div class="sub" id="scenario-help"></div>
      <div style="display:flex;gap:8px"><button class="btn primary" id="create" style="flex:1">Create demo incident</button>
      <button class="btn danger" id="reset" title="Wipe all demo data">Reset</button></div>
    </div>
    <div class="list" id="list"><div class="empty">Loading…</div></div>
  </aside>
  <section id="content"></section>
</main>

<script>
"use strict";
const $ = (s, r = document) => r.querySelector(s);
const el = (tag, attrs = {}, ...kids) => {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "class") n.className = v; else if (k === "text") n.textContent = v;
    else if (k.startsWith("on")) n.addEventListener(k.slice(2), v); else if (v !== false && v != null) n.setAttribute(k, v === true ? "" : v);
  }
  for (const k of kids.flat()) if (k != null && k !== false) n.append(k.nodeType ? k : document.createTextNode(String(k)));
  return n;
};
const api = async (path, opts = {}) => {
  // headers is pulled out BEFORE the rest is spread: spreading the caller's whole options object after the merged headers
  // would replace them and silently drop Content-Type whenever a caller passes Authorization (the approval call).
  const { headers, ...rest } = opts;
  const r = await fetch(path, { ...rest, headers: { "Content-Type": "application/json", ...(headers || {}) } });
  const body = await r.json().catch(() => ({}));
  if (!r.ok) {
    const d = body.detail;
    const msg = typeof d === "string" ? d : Array.isArray(d) ? d.map(x => x.msg || JSON.stringify(x)).join("; ") : d ? JSON.stringify(d) : `${r.status} ${r.statusText}`;
    throw new Error(msg);
  }
  return body;
};

const STATES = ["DETECTED","INVESTIGATING","DIAGNOSED","RISK_ASSESSED","AWAITING_APPROVAL","REMEDIATING","VERIFYING","RESOLVED"];
const STATUS_CLASS = { RESOLVED: "ok", CLOSED: "", FAILED: "bad", ABANDONED: "bad", AWAITING_APPROVAL: "warn", REINVESTIGATING: "info",
                       REMEDIATING: "acc", VERIFYING: "acc", INVESTIGATING: "acc", DIAGNOSED: "acc", RISK_ASSESSED: "acc", DETECTED: "" };
const pill = (text, cls = "") => el("span", { class: "pill " + cls, text });
const state = { view: "incidents", selected: null, tab: "story", system: null, busy: false, key: "", detail: null, notice: null };

/* ---------- system / mode ---------- */
async function loadSystem() {
  state.system = await api("/api/system");
  const b = state.system.bob, m = $("#mode");
  m.textContent = b.label;
  m.className = "mode " + (b.simulated ? "sim" : b.mode === "unavailable" ? "none" : "live");
  m.title = b.detail;
  $("#newbox").hidden = !state.system.demo;
  if (state.system.demo) {
    const sc = await api("/api/demo/scenarios");
    const sel = $("#scenario"); sel.replaceChildren(...sc.map(s => el("option", { value: s.scenario, text: s.title })));
    const help = () => { $("#scenario-help").textContent = (sc.find(s => s.scenario === sel.value) || {}).teaches || ""; };
    sel.onchange = help; help();
  }
}

/* ---------- incident list ---------- */
async function loadList() {
  const rows = await api("/api/incidents?limit=100");
  const list = $("#list");
  if (!rows.length) { list.replaceChildren(el("div", { class: "empty" }, state.system?.demo ? "No incidents yet. Create a demo incident above." : "No incidents yet.")); return; }
  list.replaceChildren(...rows.map(i => el("button", { class: "row", "aria-current": String(i.id === state.selected), onclick: () => select(i.id) },
    el("span", { class: "t", text: i.description }),
    el("span", { class: "m" }, pill(i.status.replaceAll("_", " "), STATUS_CLASS[i.status] || ""), pill(i.severity), el("span", { class: "sub mono", text: i.id })))));
}

async function select(id) { state.selected = id; state.tab = "story"; state.notice = null; await loadList(); await loadDetail(); render(); }
async function loadDetail() { state.detail = state.selected ? await api(`/api/incidents/${state.selected}/detail`) : null; }

/* ---------- views ---------- */
function render() {
  document.querySelectorAll("nav.tabs button").forEach(b => b.setAttribute("aria-selected", String(b.dataset.view === state.view)));
  $("#side").hidden = state.view !== "incidents";
  document.querySelector("main").style.gridTemplateColumns = state.view === "incidents" ? "" : "1fr";
  const c = $("#content"); c.replaceChildren();
  if (state.view === "incidents") c.append(incidentView());
  else if (state.view === "learning") learningView(c);
  else evaluationView(c);
}

function modeBanner() {
  const b = state.system?.bob;
  if (!b?.simulated) return null;
  return el("div", { class: "banner sim" }, el("strong", { text: "Simulated Bob. " }),
    "The diagnosing and fixing agent here is a labelled replay stand-in, not IBM Bob. Everything else is real: the git checkpoint and branch, the pytest runs, the verification levels, the rollback and the outcome ledger.");
}

function incidentView() {
  const d = state.detail;
  if (!d) return el("div", { class: "card" }, el("div", { class: "empty" }, "Select an incident, or create a demo incident."));
  const inc = d.incident, wrap = el("div", { class: "card" });
  const ended = ["RESOLVED","FAILED","ABANDONED","CLOSED"].includes(inc.status);

  const stepper = el("div", { class: "stepper" }, STATES.map(s => {
    const idx = STATES.indexOf(s), cur = STATES.indexOf(inc.status);
    let cls = "step";
    if (inc.status === s) cls += " now"; else if (cur > idx && inc.status !== "REINVESTIGATING") cls += " done";
    return el("span", { class: cls, text: s.replaceAll("_", " ") });
  }));
  if (["REINVESTIGATING","FAILED","ABANDONED","CLOSED"].includes(inc.status)) stepper.append(el("span", { class: "step " + (inc.status === "CLOSED" ? "" : inc.status === "REINVESTIGATING" ? "now" : "bad"), text: inc.status }));

  wrap.append(el("div", { class: "title" },
    el("div", { style: "display:flex;gap:10px;align-items:center;flex-wrap:wrap" }, el("h2", { text: inc.description }),
      pill("attempt " + inc.attempt + " / " + inc.max_attempts, inc.attempt > 1 ? "info" : ""), pill(inc.severity)),
    el("div", { class: "sub" }, `${inc.repository} · ${inc.type} · `, el("span", { class: "mono", text: inc.id })), stepper));

  wrap.append(actionBar(d, inc, ended));
  if (state.notice) wrap.append(el("div", { class: "notice " + state.notice.kind, text: state.notice.text }));

  const tabs = [["story","Story"],["evidence","Evidence"],["diagnosis","Diagnosis"],["risk","Risk & approval"],["patch","Patch"],["verify","Verification"],["ledger","Ledger"]];
  wrap.append(el("div", { class: "tabs2", role: "tablist" }, tabs.map(([k, l]) =>
    el("button", { role: "tab", "aria-selected": String(state.tab === k), onclick: () => { state.tab = k; render(); } }, l))));
  const body = el("div", { class: "panel" }, modeBanner());
  ({ story: storyTab, evidence: evidenceTab, diagnosis: diagnosisTab, risk: riskTab, patch: patchTab, verify: verifyTab, ledger: ledgerTab })[state.tab](body, d);
  wrap.append(body);
  return wrap;
}

function actionBar(d, inc, ended) {
  const bar = el("div", { class: "actions" });
  bar.append(el("button", { class: "btn primary", disabled: state.busy || ended || inc.status === "AWAITING_APPROVAL" && !d.gate.satisfied, onclick: () => run() },
    state.busy ? [el("span", { class: "spin" }), " Working…"] : ended ? "Finished" : "▶ Run the loop"));
  if (inc.status === "AWAITING_APPROVAL" && !d.gate.satisfied) {
    const key = el("input", { class: "field mono", type: "password", placeholder: "operator API key", value: state.key, autocomplete: "off",
                              oninput: e => { state.key = e.target.value; } });
    bar.append(el("div", { class: "approve" },
      el("strong", { text: `${d.gate.risk_level} risk: a human must approve` }), key,
      el("button", { class: "btn ok", onclick: () => decide("APPROVED") }, "Approve"),
      el("button", { class: "btn danger", onclick: () => decide("REJECTED") }, "Reject")));
    if (state.system?.demo_operator_key) bar.append(el("span", { class: "sub" }, "demo key: ", el("code", { text: state.system.demo_operator_key })));
  } else if (inc.status === "AWAITING_APPROVAL") {
    bar.append(pill("approved — run the loop to continue", "ok"));
  }
  return bar;
}

async function run() {
  state.busy = true; state.notice = null; render();
  try {
    const r = await api(`/api/incidents/${state.selected}/advance`, { method: "POST", body: "{}" });
    const kind = r.blocked_on === "approval" ? "warn" : r.blocked_on === "terminal" ? (r.status === "RESOLVED" ? "ok" : "bad") : r.blocked_on ? "warn" : "ok";
    state.notice = { kind, text: `${r.steps.length} step(s): ${r.steps.map(s => s.action).join(" → ") || "none"}.` + (r.message ? " " + r.message : "") };
  } catch (e) { state.notice = { kind: "bad", text: e.message }; }
  state.busy = false;
  await loadList(); await loadDetail(); render();
}

async function decide(decision) {
  if (!state.key) { state.notice = { kind: "warn", text: "Enter an operator API key. The approval records WHO decided, from the key — never from free text." }; render(); return; }
  try {
    await api(`/api/incidents/${state.selected}/approvals`, { method: "POST", headers: { Authorization: "Bearer " + state.key },
      body: JSON.stringify({ decision, reason: decision === "REJECTED" ? "rejected from the dashboard" : "approved from the dashboard" }) });
    state.notice = { kind: "ok", text: `${decision === "APPROVED" ? "Approved" : "Rejected"}. Run the loop to continue.` };
  } catch (e) { state.notice = { kind: "bad", text: e.message }; }
  await loadDetail(); render();
}

/* ---------- tabs ---------- */
const kindText = e => {
  const d = e.detail || {}, t = e.kind;
  if (t === "transition") return [`${e.from || "—"} → ${e.to}`, e.to === "RESOLVED" ? "ok" : ["FAILED","ABANDONED"].includes(e.to) ? "bad" : e.to === "REINVESTIGATING" ? "warn" : "acc"];
  if (t === "diagnosis") return [`Diagnosis by ${e.actor}: confidence ${(d.confidence ?? 0).toFixed(2)}` + (d.routing ? ` — routing: ${d.routing.reason}` : ""), "acc"];
  if (t === "risk") return [`Risk assessed: ${d.level} (score ${d.score})`, "acc"];
  if (t === "remediation") return [d.phase === "checkpoint" ? `Checkpoint ${String(d.base_sha).slice(0, 8)} on ${d.base_branch}; working on ${d.branch}`
    : d.phase === "patched" ? `Patch committed ${String(d.commit).slice(0, 8)}: ${(d.files || []).join(", ")}${d.simulated ? " [simulated agent]" : ""}`
    : `Rolled back: ${d.reason}`, d.phase === "rolled_back" ? "bad" : "acc"];
  if (t === "verification") return [d.passed ? "Verification PASSED" : `Verification FAILED: ${d.reason}`, d.passed ? "ok" : "bad"];
  if (t === "memory") return [`Verified diagnosis promoted to memory (${d.topic})`, "ok"];
  return [t, ""];
};
function storyTab(b, d) {
  if (!d.timeline.length) { b.append(el("div", { class: "empty" }, "Nothing has happened yet. Press “Run the loop”.")); return; }
  b.append(el("ul", { class: "tl" }, d.timeline.map(e => { const [text, cls] = kindText(e);
    return el("li", { class: cls }, el("div", { text }), el("div", { class: "who" }, `${e.actor} · ${new Date(e.at + "Z").toLocaleTimeString()}`)); })));
}
function evidenceTab(b, d) {
